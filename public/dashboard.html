<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - YesMyHome CRM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 30px; font-size: 2.5em; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #0d1117; border: 1px solid #30363d; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 2.5em; color: #58a6ff; font-weight: bold; }
        .stat-label { color: #8b949e; margin-top: 10px; }
        .leads-table { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 1px solid #30363d; color: #58a6ff; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #30363d; }
        tr:hover { background: #161b22; }
        .status-novo { color: #3fb950; font-weight: 600; }
        .btn { display: inline-block; padding: 10px 20px; background: #238636; color: white; text-decoration: none; border-radius: 6px; margin-top: 20px; }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Dashboard - YesMyHome CRM</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="total-leads">0</div>
                <div class="stat-label">Total de Leads</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="leads-novo">0</div>
                <div class="stat-label">Novos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="leads-sms">0</div>
                <div class="stat-label">SMS Enviados</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="leads-email">0</div>
                <div class="stat-label">Emails Enviados</div>
            </div>
        </div>

        <div class="leads-table">
            <h2 style="margin-bottom: 20px; color: #58a6ff;">Últimos Leads</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>WhatsApp</th>
                        <th>Imóvel</th>
                        <th>Operação</th>
                        <th>Status</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <tr>
                        <td colspan="8" style="text-align: center; color: #8b949e;">Carregando leads...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/demo-integracao.html" class="btn">← Voltar para Demo</a>
    </div>

    <script>
        async function loadLeads() {
            try {
                // Ler dados do arquivo storage/leads.json via server
                const response = await fetch('/storage/leads.json');
                if (!response.ok) throw new Error('Arquivo não encontrado');

                const leads = await response.json();

                if (Array.isArray(leads)) {
                    // Atualizar estatísticas
                    document.getElementById('total-leads').textContent = leads.length;
                    document.getElementById('leads-novo').textContent = leads.filter(l => l.status === 'novo').length;
                    document.getElementById('leads-sms').textContent = leads.length;
                    document.getElementById('leads-email').textContent = leads.filter(l => l.email).length;

                    // Carregar últimos 10 leads
                    const tbody = document.getElementById('leads-body');
                    tbody.innerHTML = '';

                    if (leads.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="8" style="text-align: center; color: #8b949e;">
                                    Nenhum lead ainda. Volte para a demo e envie um formulário!
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    leads.slice(-10).reverse().forEach(lead => {
                        const row = document.createElement('tr');
                        const date = lead.created_at ? new Date(lead.created_at).toLocaleDateString('pt-BR') : '-';
                        row.innerHTML = `
                            <td>#${lead.id}</td>
                            <td>${lead.name || '-'}</td>
                            <td>${lead.email || '-'}</td>
                            <td>${lead.whatsapp || '-'}</td>
                            <td>${lead.property_type || '-'}</td>
                            <td>${lead.operation_type || '-'}</td>
                            <td><span class="status-novo">${lead.status || 'novo'}</span></td>
                            <td>${date}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar leads:', error);
                document.getElementById('leads-body').innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; color: #3fb950;">
                            ⏳ Carregando dados...
                        </td>
                    </tr>
                `;
            }
        }

        // Carregar leads ao abrir a página
        loadLeads();

        // Recarregar a cada 5 segundos
        setInterval(loadLeads, 5000);
    </script>
</body>
</html>
